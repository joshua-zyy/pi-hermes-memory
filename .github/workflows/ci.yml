name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run check

  min-sdk:
    name: Min Supported SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # The `check` job installs whatever the devDependency range resolves to,
      # which is always new enough to hide a broken peerDependencies floor.
      # This one type-checks against the oldest Pi we advertise support for.
      - run: npm run check:min-sdk

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Check for uncommitted changes
        run: git diff --exit-code

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # better-sqlite3 ships N-API prebuilds; the install script would try to
      # compile with MSVC and fail on the runner image.
      - run: npm ci --ignore-scripts

      - run: npm run check

      # Known Windows failures are allowed so the job catches new breakage
      # without going red on the existing backlog (see docs/WINDOWS.md).
      - name: Tests
        env:
          TEST_ALLOW_FAILURES: >-
            tests/handlers/pi-child-process.test.ts,
            tests/handlers/skills-command.test.ts,
            tests/project-rebinding.test.ts,
            tests/store/sqlite-lazy-load.test.ts,
            tests/store/sqlite-native.test.ts,
            tests/handlers/sync-markdown-memories.test.ts,
            tests/store/db.test.ts
        run: npm test
